<title>채널 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F2EF; --panel:#FFFFFF; --ink:#16181D; --muted:#6B6A66; --line:#E2E0DA; --soft:#F8F7F4;
  --accent:#D92B21; --accent-soft:#FBE7E5; --good:#1E7A4C; --good-soft:#E3F2EA; --warn:#9A6A00; --warn-soft:#FFF3D6;
  --short:#3B5BDB; --short-soft:#E7ECFD; --long:#7A4BC4; --long-soft:#F0E9FB;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121316; --panel:#1B1D21; --ink:#ECEBE7; --muted:#9C9A94; --line:#2C2E33; --soft:#202226;
  --accent:#FF5A4E; --accent-soft:#3A1D1B; --good:#5FCB93; --good-soft:#16301F; --warn:#E8B64A; --warn-soft:#352A12;
  --short:#8CA3FF; --short-soft:#1D2440; --long:#C4A2F5; --long-soft:#2A2138;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121316; --panel:#1B1D21; --ink:#ECEBE7; --muted:#9C9A94; --line:#2C2E33; --soft:#202226;
  --accent:#FF5A4E; --accent-soft:#3A1D1B; --good:#5FCB93; --good-soft:#16301F; --warn:#E8B64A; --warn-soft:#352A12;
  --short:#8CA3FF; --short-soft:#1D2440; --long:#C4A2F5; --long-soft:#2A2138;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.wrap>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px;text-wrap:balance}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.tz{display:inline-flex;border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}
.tz button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}
.tz button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.day{flex:0 0 auto;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;display:grid;gap:1px;text-align:left;min-width:74px}
.day small{color:var(--muted);font-size:11px}
.day b{font-family:var(--mono);font-weight:600;font-size:13px}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day:focus-visible,.tz button:focus-visible,.chrow:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile span{color:var(--muted);font-size:12px}
.tile b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:11px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel h2{font-size:14px;font-weight:600;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.panel h2 small{color:var(--muted);font-weight:400;font-size:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:500;color:var(--muted);text-align:right;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.2px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:13px}
td.name{font-family:var(--sans);font-size:14px;font-weight:600}
tr:last-child td{border-bottom:0}
.chrow{cursor:pointer}
.chrow:hover td{background:var(--soft)}
.caret{display:inline-block;width:14px;color:var(--muted);font-weight:400;transition:transform .15s}
.chrow[aria-expanded="true"] .caret{transform:rotate(90deg)}
.zero td{color:var(--muted)}
.chgo{margin-left:6px;color:var(--muted);text-decoration:none;font-weight:400;font-size:13px;padding:2px 4px;border-radius:4px}
.chgo:hover{color:var(--accent);background:var(--accent-soft)}
.idle td.idle-cell{font-family:var(--sans);font-size:12.5px;color:var(--muted);text-align:left;white-space:normal}
.idle:hover td{background:var(--soft)}
.zero td.name{font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.vids td{background:var(--soft);font-size:12.5px}
.vids td.t{font-family:var(--sans);white-space:normal;min-width:220px;max-width:460px}
.vids a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.vids a:hover{border-color:var(--accent)}
.pill{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.pill.short{background:var(--short-soft);color:var(--short)}
.pill.long{background:var(--long-soft);color:var(--long)}
.age{color:var(--muted);font-size:11px}
.subs{display:block;font-size:13px}
.delta{display:block;font-size:11px;color:var(--muted)}
.delta.up{color:var(--good)}
.delta.down{color:var(--accent)}
.state{padding:28px 16px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.note{color:var(--muted);font-size:12px;line-height:1.7}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:12px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile b{font-size:22px}.hide-sm{display:none}}
/* 폰: 채널 이름 칸을 왼쪽에 붙여두고 숫자 칸은 옆으로 밀어서 본다 */
th:first-child,td.name{position:sticky;left:0;z-index:1;background:var(--panel)}
th:first-child{background:var(--soft)}
.chrow:hover td.name{background:var(--soft)}
@media (max-width:560px){
  .wrap{gap:14px;padding-block:14px 36px}
  h1{font-size:19px}
  .tile{padding:12px}
  .tile b{font-size:20px}
  th,td{padding:8px 9px}
  td{font-size:12.5px}
  td.name{font-size:13px;max-width:132px;white-space:normal;line-height:1.35}
  .vids td.t{min-width:200px}
  .day{min-width:64px;padding:6px 10px}
  .tz button{padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
/* ===== 디스커버리 대시보드 (0927, 픽셀링식 사이드바) ===== */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding-block:18px;padding-inline:12px;display:grid;align-content:start;gap:4px}
.brand{font-weight:700;font-size:15px;padding:4px 10px 12px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.navgrp{font-size:10.5px;letter-spacing:.8px;color:var(--muted);padding:12px 10px 4px}
.nav{font:inherit;font-size:13.5px;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.nav:hover{background:var(--soft)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .ic{width:18px;text-align:center;flex:0 0 auto}
main.wrap{max-width:1240px;width:100%}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.view>*{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden;flex-wrap:wrap;justify-self:start}
.seg button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.flabel{font-size:11.5px;color:var(--muted);min-width:56px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cats{padding:12px 16px;display:grid;gap:9px}
.cat{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.cat .bar{height:8px}.cat .bar i{background:var(--short)}
.cat small{font-family:var(--mono);color:var(--muted);font-size:12px;white-space:nowrap}
.memo{background:var(--good-soft);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.7}
.memo b{display:block;color:var(--good);font-size:12px;margin-bottom:4px}
.memo p{margin:0 0 4px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.tl li.withth{grid-template-columns:34px auto minmax(0,1fr) auto;align-items:center}
.tl li:last-child{border-bottom:0}
.tl .rk{font-family:var(--mono);font-weight:600;color:var(--muted);font-size:13px;padding-top:1px}
.tl a{color:var(--ink);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.tl a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.tl .meta{color:var(--muted);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.tl .num{text-align:right;font-family:var(--mono);white-space:nowrap}
.tl .num b{display:block;font-size:14px;font-weight:600;color:var(--accent)}
.tl .num small{color:var(--muted);font-size:11px;display:block}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;margin-right:4px;vertical-align:1px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.new{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.boom{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.cat,.tag.short{background:var(--short-soft);color:var(--short);border-color:transparent}
.tag.long{background:var(--long-soft);color:var(--long);border-color:transparent}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* 썸네일 카드 */
.th{display:block;background-repeat:no-repeat;background-color:#111;flex:0 0 auto}
.th.none{display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;width:100%;height:100%}
.grids{display:grid;gap:14px;padding:14px}
.grid{display:grid;gap:14px}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.l{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{display:grid;align-content:start;gap:8px;min-width:0}
.cthumb{position:relative;display:flex;justify-content:center;align-items:center;background:#0d0d0f;border-radius:10px;overflow:hidden;text-decoration:none}
.card.short .cthumb{height:240px}
.card.long .cthumb{height:135px}
.cthumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cthumb .rank{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.72);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.cthumb .gain{position:absolute;bottom:6px;right:6px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px}
.cthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;opacity:0;background:rgba(0,0,0,.28);transition:opacity .15s}
.cthumb:hover .play,.cthumb:focus-visible .play{opacity:1}
.cbody{display:grid;gap:4px;min-width:0}
.ctitle{color:var(--ink);text-decoration:none;font-weight:600;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ctitle:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.ctags{display:flex;flex-wrap:wrap;gap:3px}
.ctags:empty{display:none}
.cmeta{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xth{display:inline-flex;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px;float:left}
.xt td.t{font-family:var(--sans);white-space:normal;min-width:260px;max-width:560px;text-align:left}
.xt td.t a{color:var(--ink);text-decoration:none;font-weight:500}
.xt td.t a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.xt td.t small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.count{color:var(--muted);font-size:12px}
@media (max-width:980px){.cols3,.cols2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{z-index:5;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding-block:8px;padding-inline:12px;gap:4px;scrollbar-width:none}
  .brand,.navgrp{display:none}
  .nav{padding:7px 10px;font-size:13px}
}
@media (max-width:560px){
  .tl li{grid-template-columns:26px minmax(0,1fr);padding:10px 12px}.tl li.withth{grid-template-columns:26px auto minmax(0,1fr)}.tl li.withth .num{grid-column:3}
  .tl .num{grid-column:2;text-align:left}.tl .num b,.tl .num small{display:inline;margin-right:6px}
  .cat{grid-template-columns:90px minmax(0,1fr)}.cat small{grid-column:2}
  .grid.s{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.l{grid-template-columns:minmax(0,1fr)}
  .grids{padding:10px}
}
@media (prefers-reduced-motion:reduce){.cthumb .play{transition:none}}
/* 0927 2차: 오늘 만들 것 · 비교 · 목표 */
.todo{display:grid;gap:0}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.trow:last-child{border-bottom:0}
.trow.done{opacity:.55}
.trow .cthumb{width:135px}
.trow .card.long .cthumb,.trow .cthumb[style*="135px"]{width:240px}
.tbody{display:grid;gap:5px;min-width:0}
.who{font-size:13.5px}
.who b{color:var(--accent)}
.quote{font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px;justify-self:start}
.orig{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:13px}
.orig a{color:var(--ink);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.orig a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.vs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:14px}
.why{padding:0 16px 14px;font-size:13px;color:var(--ink)}
.goal{padding:14px 16px;display:grid;gap:8px}
.gnum{font-family:var(--mono);font-size:24px;font-weight:600}
.bar.big{height:12px;border-radius:6px}
.bar.big i{background:var(--good)}
#mine-extra{display:grid;gap:16px}
@media (max-width:560px){.trow{grid-template-columns:minmax(0,1fr)}.trow .cthumb{width:100%!important}}
.refresh{background:var(--card,#1b1d22);color:inherit;border:1px solid rgba(128,128,128,.35);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.refresh:hover{border-color:rgba(128,128,128,.7)}
.refresh[disabled]{opacity:.55;cursor:default}
#freshline{font-size:12px;opacity:.75}
.side{display:none!important}</style>

<div class="app">
<aside class="side" id="side" aria-label="메뉴" hidden></aside>
<main class="wrap">
  <header>
    <div>
      <h1>채널 현황판</h1>
      <div class="sub" id="updated">데이터 불러오는 중…</div>
      <div class="sub" id="freshline" style="margin-top:4px"></div>
    </div>
    <button type="button" id="refresh" class="refresh" title="최신 수치를 다시 불러와">새로고침</button>
    <div class="tz" role="group" aria-label="날짜 기준 시간대">
      <button type="button" id="tz-aest" aria-pressed="true">호주 시간</button>
      <button type="button" id="tz-kst" aria-pressed="false">한국 시간</button>
    </div>
  </header>

  <div class="view" id="v-mine">
  <nav class="days" id="days" aria-label="날짜 선택"></nav>

  <section class="tiles" aria-label="선택한 날 합계">
    <div class="tile"><span>올라간 영상</span><b id="t-count">–</b><small id="t-count-sub">&nbsp;</small></div>
    <div class="tile"><span>조회수</span><b id="t-views">–</b><small>그날 올라간 영상 합계</small></div>
    <div class="tile"><span>좋아요</span><b id="t-likes">–</b><small id="t-likes-sub">&nbsp;</small></div>
    <div class="tile"><span>댓글</span><b id="t-comments">–</b><small>그날 올라간 영상 합계</small></div>
  </section>

  <section class="panel">
    <h2>채널별 <small id="panel-sub">줄을 누르면 영상 목록이 펼쳐져</small></h2>
    <div class="scroll">
      <table>
        <thead><tr><th>채널</th><th>구독자</th><th>영상</th><th>조회수</th><th class="hide-sm">비중</th><th>좋아요</th><th>댓글</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="state"><b>불러오는 중</b>잠깐만.</td></tr></tbody>
      </table>
    </div>
  </section>

  <div id="errors"></div>
  <p class="note">조회수·좋아요·댓글은 유튜브 공개 수치를 모은 시점 기준이야. 좋아요가 0개거나 숨긴 영상은 "–"로 나와. 구독자 수는 유튜브가 반올림해서 보여주는 값이고, 숨긴 채널은 "비공개"야. 2시간마다(새벽 포함) 새로 모아. 수익은 넣지 않았어.</p>
  <div id="mine-extra"></div>
  </div>

  <div class="view" id="v-disc" hidden>
    <nav class="days" id="tdays" aria-label="발굴 날짜"></nav>
    <div id="dbody" class="view"></div>
  </div>
</main>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const nf = new Intl.NumberFormat('ko-KR');
  const fmt = n => (n==null ? '–' : nf.format(n));
  const TZ = {aest:'Australia/Brisbane', kst:'Asia/Seoul'};
  let tz = 'aest'; try{ tz = localStorage.getItem('dash:tz') || 'aest'; }catch(e){}
  let data = null, selected = null, showIdle = false; const open = new Set();

  function dayKey(ts, zone){
    return new Intl.DateTimeFormat('en-CA',{timeZone:TZ[zone],year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ts*1000));
  }
  function timeOf(ts, zone){
    return new Intl.DateTimeFormat('ko-KR',{timeZone:TZ[zone],hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts*1000));
  }
  function dayLabel(key){
    const [y,m,d] = key.split('-').map(Number);
    const wd = ['일','월','화','수','목','금','토'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];
    return {top: `${m}/${d} (${wd})`};
  }
  function dur(s){ if(!s) return ''; const m=Math.floor(s/60), r=s%60; return m? `${m}:${String(r).padStart(2,'0')}` : `${r}초`; }
  function ago(ts){
    const h = (Date.now()/1000 - ts)/3600;
    return h < 1 ? '방금' : h < 24 ? `${Math.floor(h)}시간 전` : `${Math.floor(h/24)}일 전`;
  }
  function sum(list,k){ let s=0, any=false; for(const v of list){ if(v[k]!=null){ s+=v[k]; any=true; } } return any? s : null; }

  function render(){
    document.querySelectorAll('.tz button').forEach(b=>b.setAttribute('aria-pressed', String(b.id==='tz-'+tz)));
    if(!data){ return; }
    const vids = (data.videos||[]).filter(v=>v.ts);
    const byDay = new Map();
    for(const v of vids){ const k=dayKey(v.ts,tz); if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(v); }
    const today = dayKey(Math.floor(Date.now()/1000), tz);
    const keys = [];
    for(let i=0;i<14;i++){ const k = dayKey(Math.floor(Date.now()/1000) - i*86400, tz); if(!keys.includes(k)) keys.push(k); }
    if(!selected || !keys.includes(selected)) selected = keys.find(k => (byDay.get(k)||[]).length) || today;

    const daysEl = $('days'); daysEl.replaceChildren();
    for(const k of keys){
      const list = byDay.get(k)||[];
      const b = document.createElement('button'); b.type='button'; b.className='day';
      b.setAttribute('aria-pressed', String(k===selected));
      const lab = dayLabel(k);
      b.innerHTML = `<small></small><b></b>`;
      b.querySelector('small').textContent = k===today ? '오늘' : lab.top;
      b.querySelector('b').textContent = list.length ? `${list.length}편` : '0편';
      b.onclick = ()=>{ selected=k; render(); };
      daysEl.append(b);
    }

    const dayVids = (byDay.get(selected)||[]);
    const shorts = dayVids.filter(v=>v.kind==='short').length;
    $('t-count').textContent = fmt(dayVids.length);
    $('t-count-sub').textContent = dayVids.length ? `숏폼 ${shorts} · 롱폼 ${dayVids.length-shorts}` : '이날은 올라간 영상이 없어';
    $('t-views').textContent = fmt(sum(dayVids,'views') ?? (dayVids.length?null:0));
    const likes = sum(dayVids,'likes');
    $('t-likes').textContent = fmt(likes ?? (dayVids.length?null:0));
    const hidden = dayVids.filter(v=>v.likes==null).length;
    $('t-likes-sub').textContent = hidden ? `좋아요 숨김 ${hidden}편 제외` : '그날 올라간 영상 합계';
    $('t-comments').textContent = fmt(sum(dayVids,'comments') ?? (dayVids.length?null:0));

    const maxViews = Math.max(1, ...data.channels.map(c => sum(dayVids.filter(v=>v.cid===c.cid),'views')||0));
    const tb = $('rows'); tb.replaceChildren();
    const chans = [...data.channels].sort((a,b)=>(sum(dayVids.filter(v=>v.cid===b.cid),'views')||0)-(sum(dayVids.filter(v=>v.cid===a.cid),'views')||0));
    const idle = chans.filter(c=>!dayVids.some(v=>v.cid===c.cid));
    const active = chans.filter(c=>dayVids.some(v=>v.cid===c.cid));
    const drawChannel = (c)=>{
      const list = dayVids.filter(v=>v.cid===c.cid).sort((a,b)=>b.ts-a.ts);
      const tr = document.createElement('tr');
      tr.className = 'chrow' + (list.length? '' : ' zero');
      const vs = sum(list,'views')||0;
      tr.innerHTML = `<td class="name"><span class="caret">›</span><span class="cn"></span></td><td class="sb"><span class="subs"></span><span class="delta"></span></td><td>${list.length}</td><td>${list.length?fmt(vs):'–'}</td><td class="hide-sm"><div class="bar"><i style="width:${(vs/maxViews*100).toFixed(1)}%"></i></div></td><td>${list.length?fmt(sum(list,'likes')):'–'}</td><td>${list.length?fmt(sum(list,'comments')):'–'}</td>`;
      tr.querySelector('.cn').textContent = c.name;
      if(c.cid){ const go=document.createElement('a'); go.className='chgo'; go.textContent='↗'; go.title='채널 열기'; go.setAttribute('aria-label', c.name+' 채널 열기');
        go.href='https://www.youtube.com/channel/'+c.cid; go.target='_blank'; go.rel='noopener'; go.onclick=e=>e.stopPropagation();
        tr.querySelector('td.name').append(go); }
      tr.querySelector('.subs').textContent = c.subs!=null ? fmt(c.subs) : '비공개';
      const dl = tr.querySelector('.delta');
      if(c.subs!=null && c.subs_prev!=null){
        const df = c.subs - c.subs_prev;
        dl.textContent = df===0 ? '변동 없음' : (df>0?'+':'−') + fmt(Math.abs(df));
        dl.classList.add(df>0?'up':df<0?'down':'flat');
        dl.title = '비교 기준: ' + new Date(c.subs_prev_ts*1000).toLocaleString('ko-KR');
      }
      if(list.length){
        tr.tabIndex = 0; tr.setAttribute('role','button');
        tr.setAttribute('aria-expanded', String(open.has(c.cid)));
        const toggle = ()=>{ open.has(c.cid)? open.delete(c.cid) : open.add(c.cid); render(); };
        tr.onclick = toggle; tr.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } };
      } else { tr.querySelector('.caret').style.visibility='hidden'; }
      tb.append(tr);
      if(list.length && open.has(c.cid)){
        for(const v of list){
          const r = document.createElement('tr'); r.className='vids';
          r.innerHTML = `<td class="t" colspan="2"><span class="pill"></span><a target="_blank" rel="noopener"></a><div class="age"></div></td><td>${timeOf(v.ts,tz)}</td><td>${fmt(v.views)}</td><td class="hide-sm">${dur(v.dur)}</td><td>${fmt(v.likes)}</td><td>${fmt(v.comments)}</td>`;
          const p = r.querySelector('.pill'); p.classList.add(v.kind); p.textContent = v.kind==='short'?'숏폼':'롱폼';
          const a = r.querySelector('a'); a.textContent = v.title || v.id;
          a.href = (v.kind==='short' ? 'https://www.youtube.com/shorts/' : 'https://www.youtube.com/watch?v=') + v.id;
          r.querySelector('.age').textContent = `${ago(v.ts)} 업로드`;
          tb.append(r);
        }
      }
    };
    active.forEach(drawChannel);
    if(idle.length){
      const tr = document.createElement('tr'); tr.className='chrow idle'; tr.tabIndex=0; tr.setAttribute('role','button');
      tr.setAttribute('aria-expanded', String(showIdle));
      tr.innerHTML = `<td colspan="7" class="idle-cell"><span class="caret">›</span><span class="it"></span></td>`;
      tr.querySelector('.it').textContent = showIdle ? `이날 안 올린 채널 ${idle.length}개 접기` : `이날 안 올린 채널 ${idle.length}개 — ${idle.map(c=>c.name).join(' · ')}`;
      const t = ()=>{ showIdle=!showIdle; render(); };
      tr.onclick=t; tr.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); t(); } };
      tb.append(tr);
      if(showIdle) idle.forEach(drawChannel);
    }
    $('panel-sub').textContent = dayVids.length ? '줄을 누르면 영상 목록이 펼쳐져' : '이날은 올라간 영상이 없어';
    const u = new Date(data.updated*1000);
    const subsTotal = sum(data.channels,'subs');
    $('updated').textContent = `전체 구독자 ${fmt(subsTotal)} · ${new Intl.DateTimeFormat('ko-KR',{timeZone:TZ[tz],month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(u)} 기준 · 채널 ${data.channels.length}개 · 최근 영상 ${vids.length}편`;
    const errs = (data.errors||[]);
    const eb = $('errors'); eb.replaceChildren();
    if(errs.length){ const d=document.createElement('div'); d.className='warnbox'; d.textContent = `이번에 못 가져온 항목 ${errs.length}개가 있어. 다음 갱신 때 다시 시도해.`; eb.append(d); }
  }

  $('tz-aest').onclick = ()=>{ tz='aest'; try{localStorage.setItem('dash:tz',tz)}catch(e){} selected=null; render(); };
  $('tz-kst').onclick = ()=>{ tz='kst'; try{localStorage.setItem('dash:tz',tz)}catch(e){} selected=null; render(); };

  function showState(title, text){
    $('rows').innerHTML = `<tr><td colspan="7" class="state"><b></b><span></span></td></tr>`;
    $('rows').querySelector('b').textContent = title; $('rows').querySelector('span').textContent = text;
  }

  // 1012: 클로드 한도와 무관하게 — 깃허브 gist 에 올린 최신 수치를 직접 읽는다(더 새것이면 씀)
  const GIST = 'https://gist.githubusercontent.com/belabunny89/40bb62126715a614edc43dc1aeac7f80/raw/snap_latest.json?t='+Date.now();  // 1012: 페이지와 같이 올린 파일(바깥 주소는 claude.ai 가 막음)
  async function pullGist(){
    try{ let r = null; try{ r = await fetch('snap.json?t='+Date.now(), {cache:'no-store'}); }catch(e){}
      if(!r || !r.ok) r = await fetch(GIST.split('?t=')[0]+'?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
      const j = await r.json();
      if(j && j.updated && (!data || (data.updated||0) < j.updated)){ data = j; render(); window.dispatchEvent(new CustomEvent('snapgist',{detail:j})); }
    }catch(e){}
  }
  pullGist(); setInterval(pullGist, 10*60*1000);
  (async function(){
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if(!db && data) return;
    if(!db){ return; }  // 1015: 깃허브 페이지판 — gist 만 읽음
    db.doc('snap/latest').onSnapshot(s=>{
      if(!s.exists){ showState('아직 모은 데이터가 없어', '첫 수집이 끝나면 여기 채워져.'); $('updated').textContent='대기 중'; return; }
      const n = s.data(); if(!data || (data.updated||0) <= (n.updated||0)){ data = n; render(); }
    }, e=>{ showState('데이터를 못 불러왔어', '페이지를 새로고침해줘.'); });
  })();
  render();
})();
</script>
<script>
/* 내 대시보드 디스커버리 (0927, 픽셀링 참고)
   db: trend/index {days,latest}, 하루치 = trend/{d,x,p,a,m,s}-YYYY-MM-DD (문서 한도 256KB 라 나눔)
   d 본문 · x 탐색 풀 · p 정치 · a 오늘 할 일 등 · m 영화·드라마 · s SNS·커뮤니티·검색어 */
(function(){
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
  const man = n => n==null ? '–' : n>=1e8 ? (n/1e8).toFixed(1)+'억' : n>=1e4 ? (n>=1e6 ? Math.round(n/1e4) : (n/1e4).toFixed(1))+'만' : String(Math.round(n));
  const flag = c => c==='전세계' ? '🌍' : /^[A-Z]{2}$/.test(c) ? c.replace(/./g, ch => String.fromCodePoint(0x1F1E6 + ch.charCodeAt(0) - 65)) : c;
  const flags = (w, n=6) => (w||[]).slice(0,n).map(flag).join('') + ((w||[]).length>n ? '+'+(w.length-n) : '');
  const ageTxt = ts => { if(!ts) return ''; const h=(Date.now()/1000-ts)/3600; return h<1?'방금':h<48?Math.round(h)+'시간 전':Math.round(h/24)+'일 전'; };
  const ytUrl = (id, kind) => (kind==='short'||kind==='s' ? 'https://www.youtube.com/shorts/' : 'https://www.youtube.com/watch?v=') + id;
  const hms = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
  const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

  const VIEWS = [
    {id:'mine', ic:'🏠', name:'내 채널', grp:'홈'},
  ];  // 1012: 내 채널만 남김
  let view = store.get('dash:view4','mine'); if(!VIEWS.some(v=>v.id===view)) view='mine';
  let idx = null, docs = {}, tsel = null, db = null, unsub = null, snap = null;
  const F = Object.assign({period:'d', type:'all', ctry:[], gain:'all', subs:'all', sort:'g', sa:true}, store.get('dash:vf', {}));
  const T = Object.assign({dorm:'정치', rising:'sd', pol:'보수', news:'short_daily', sns:'tiktok', out:'global', ch:'all', media:'영화', comm:'groups', kids:'short'}, store.get('dash:tabs', {}));
  const setTab = (k,v)=>{ T[k]=v; store.set('dash:tabs', T); render(); };

  /* ---------- 공통 조각 ---------- */
  function nav(){
    const side = $('side'); side.replaceChildren();
    const b0 = el('div','brand','내 대시보드'); b0.append(el('small',null,'채널 현황 + 정치 + 전세계 발굴')); side.append(b0);
    let g = null;
    for(const v of VIEWS){
      if(v.grp!==g){ g=v.grp; if(g!=='홈') side.append(el('div','navgrp',g)); }
      const b = el('button','nav'); b.type='button';
      b.append(el('span','ic',v.ic), el('span',null,v.name));
      if(v.id===view) b.setAttribute('aria-current','page');
      b.onclick = ()=>{ view=v.id; store.set('dash:view4',view); show(); window.scrollTo(0,0); };
      side.append(b);
    }
  }
  function show(){
    nav();
    const mine = view==='mine';
    $('v-mine').hidden = !mine; $('v-disc').hidden = mine;
    document.querySelector('.tz').style.visibility = mine ? '' : 'hidden';
    const v = VIEWS.find(x=>x.id===view);
    document.querySelector('header h1').textContent = mine ? '채널 현황판' : v.name;
    $('updated').hidden = !mine;
    if(mine) mineExtra(); else render();
  }
  function panel(title, sub){ const p=el('section','panel'); const h=el('h2',null,title); if(sub) h.append(el('small',null,sub)); p.append(h); return p; }
  function state(title, text){ const d=el('div','state'); d.append(el('b',null,title), el('span',null,text)); return d; }
  function seg(opts, cur, on){ const s=el('div','seg'); for(const [k,t] of opts){ const b=el('button',null,t); b.type='button'; b.setAttribute('aria-pressed', String(k===cur)); b.onclick=()=>on(k); s.append(b); } return s; }
  function link(text, href, cls){ const a=el('a',cls||null,text); a.href=href; a.target='_blank'; a.rel='noopener'; return a; }

  let CUR = null;
  function thumb(key, scale){
    const t = CUR && CUR.thumbs && CUR.thumbs[key];
    if(!t) return null;
    let url, W, H, x, y, w, h;
    if(t.length===5){ const [sh,a,b,c,d] = t; url = CUR.sprites && CUR.sprites[sh]; [W,H] = (CUR.sheets||{})[sh]||[0,0]; [x,y,w,h]=[a,b,c,d]; }
    else { url = CUR.sprite; [W,H] = CUR.sprite_size||[0,0]; [x,y,w,h]=t; }
    if(!url) return null;
    const e = el('span','th');
    e.style.width = (w*scale)+'px'; e.style.height = (h*scale)+'px';
    e.style.backgroundImage = `url("${url}")`;
    e.style.backgroundSize = `${W*scale}px ${H*scale}px`;
    e.style.backgroundPosition = `${-x*scale}px ${-y*scale}px`;
    return e;
  }
  function card(v, i, opt={}){
    const kind = v.kind || (v.k==='s'?'short':'long');
    const c = el('article','card '+kind);
    const href = opt.href || ytUrl(v.id, kind);
    const a = link('', href, 'cthumb'); a.setAttribute('aria-label', (v.title||v.t||'')+' 열기');
    const t = thumb(opt.key || v.id, 1); if(t) a.append(t); else a.append(el('span','th none', kind==='short'?'쇼츠':'영상'));
    if(i!=null) a.append(el('span','rank', String(i+1)));
    a.append(el('span','gain', opt.badge || (opt.pol ? man(v.views)+'회' : '+'+man(v.gain ?? v.g))));
    a.append(el('span','play','▶'));
    c.append(a);
    const b = el('div','cbody');
    b.append(link(opt.title || v.title || v.t || v.id, href, 'ctitle'));
    const tags = el('div','ctags');
    for(const [cls,txt] of (opt.tags||[])) tags.append(el('span','tag '+cls, txt));
    if(opt.ratio && v.ratio!=null) tags.append(el('span','tag boom', `구독자의 ${v.ratio}배`));
    if(v.cat) tags.append(el('span','tag cat', v.cat));
    if(v.work) tags.append(el('span','tag cat', v.work));
    if(v.new) tags.append(el('span','tag new','🆕')); else if(v.streak) tags.append(el('span','tag', v.streak+'일째'));
    if(v.breakout) tags.append(el('span','tag boom','🚀'));
    b.append(tags);
    for(const line of (opt.meta || null) || [
      `${v.channel||v.c||''}${(v.subs ?? v.s)!=null?' · 구독 '+man(v.subs ?? v.s):''}`,
      opt.pol ? `시간당 ${man(v.vph)} · ${ageTxt(v.published)}${v.likes!=null?' · 좋아요 '+man(v.likes):''}`
              : `누적 ${man(v.views ?? v.w)} · ${flags(v.where||v.r,5)}${(v.published||v.p)?' · '+ageTxt(v.published||v.p):''}`]) b.append(el('div','cmeta', line));
    c.append(b); return c;
  }
  function grid(list, opt={}){
    const box = el('div','grids');
    const isS = v => (v.kind || (v.k==='s'?'short':'long'))==='short';
    const S = list.map((v,i)=>[v,i]).filter(([v])=>isS(v)), L = list.map((v,i)=>[v,i]).filter(([v])=>!isS(v));
    for(const [arr,cls] of [[S,'grid s'],[L,'grid l']]){ if(!arr.length) continue; const g=el('div',cls); arr.forEach(([v,i])=>g.append(card(v,i,opt))); box.append(g); }
    if(!list.length) box.append(state('없음','이날은 해당 영상이 없어.'));
    return box;
  }
  function chipsRow(title, list){
    const p = panel(title); const box = el('div','chips'); box.style.padding='12px 16px';
    const mx = Math.max(1, ...list.map(x=>x[1]));
    for(const [w,v] of list){ const c = el('span','chip', `${w} ${man(v)}`); c.style.cursor='default'; if(v===mx) c.setAttribute('aria-pressed','true'); box.append(c); }
    if(!list.length) box.append(el('span','count','없음'));
    p.append(box); return p;
  }
  function chanList(list, sub){
    const ol = el('ol','tl');
    for(const [i,c] of (list||[]).entries()){
      const L = el('li', c.top_id ? 'withth' : null); L.append(el('span','rk',String(i+1)));
      if(c.top_id){ const ta=link('', ytUrl(c.top_id,c.top_kind), 'xth'); const tt=thumb(c.top_id,0.42); if(tt) ta.append(tt); L.append(ta); }
      const mid = el('div'); mid.append(link(c.name||c.cid, 'https://www.youtube.com/channel/'+c.cid));
      const m = el('div','meta');
      if(c.ratio!=null && c.ratio>=1) m.append(el('span','tag boom', `구독자의 ${c.ratio}배`));
      if(c.kid) m.append(el('span','tag','👶'));
      m.append(document.createTextNode(`구독 ${man(c.subs)}` + (c.short!=null ? ` · 쇼츠 ${c.short} · 롱폼 ${c.long} · ${flags(c.where)}` : ` · 영상 ${c.n}편`)));
      if(c.top_title){ m.append(document.createTextNode(' · 대표: ')); const ta=link((c.top_title||'').slice(0,60), ytUrl(c.top_id,c.top_kind)); ta.style.fontWeight='400'; m.append(ta); }
      mid.append(m);
      const num = el('div','num'); num.append(el('b',null,(c.gain!=null?'+'+man(c.gain):man(c.views))), el('small',null, sub || (c.n+'편')));
      L.append(mid, num); ol.append(L);
    }
    if(!(list||[]).length) ol.append(state('없음',''));
    return ol;
  }

  /* ---------- 날짜·렌더 ---------- */
  function dayNav(){
    const nav = $('tdays'); nav.replaceChildren();
    if(!idx) return;
    for(const d of [...idx.days].reverse()){
      const b = el('button','day'); b.type='button'; b.setAttribute('aria-pressed', String(d===tsel));
      const [y,mo,da] = d.split('-').map(Number);

  /* ---------- 📊 내 채널 보강 ---------- */
  const PEOPLE = ['이재명','김현지','한동훈','장동혁','정청래','유시민','김어준','주진우','나경원','박지원','추미애','조국','이진숙','김태규','서영교','강훈식','조희대','윤석열','김건희','이준석','홍준표','김민석'];
  const OURPOL = ['보수만세','명불허전','민주사관학교'];
  function mineExtra(){
    const box = $('mine-extra'); if(!box) return;
    box.replaceChildren();
    if(!snap){ box.append(state('채널 데이터를 불러오는 중','')); return; }
    const now = Date.now()/1000;
    const vids = (snap.videos||[]).filter(v=>v.ts && v.views!=null);
    const old = vids.filter(v=>now-v.ts>=86400);
    const med = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
    const tot14 = vids.reduce((a,v)=>a+(v.views||0),0);
    const pol14 = vids.filter(v=>OURPOL.includes(v.ch)).reduce((a,v)=>a+(v.views||0),0);
    const month = Math.round(tot14/14*30);
    const g = panel('🎯 월 1,000만 목표', '최근 14일 올린 영상 조회 합을 한 달로 환산');
    const gb = el('div','goal');
    const bar = el('div','bar big'); const bi = el('i'); bi.style.width = Math.min(100, month/1e7*100).toFixed(1)+'%'; bar.append(bi);
    gb.append(el('div','gnum', `${man(month)} / 1,000만`), bar, el('div','cmeta', `14일 조회 합 ${man(tot14)} (정치 3채널 ${man(pol14)}) · 목표까지 ${(1e7/Math.max(month,1)).toFixed(1)}배 필요`));
    g.append(gb); box.append(g);
    const chs = {}; for(const v of old) (chs[v.ch]=chs[v.ch]||[]).push(v);
    const rel = v => v.views/Math.max(med((chs[v.ch]||[]).map(x=>x.views)),1);
    const icon = r => r>=3?'🔥':r>=1.3?'👍':r>=0.5?'😐':'💀';
    const two = el('div','cols2');
    const sorted = [...old].sort((a,b)=>rel(b)-rel(a));
    const mk = (title, list) => { const p=panel(title,'채널 중앙값 대비'); const ol=el('ol','tl'); list.forEach(v=>{ const L=el('li'); L.append(el('span','rk',icon(rel(v)))); const mid=el('div'); mid.append(link(v.title||v.id, ytUrl(v.id,v.kind))); mid.append(el('div','meta',`${v.ch} · ${ageTxt(v.ts)}`)); const n=el('div','num'); n.append(el('b',null,man(v.views)), el('small',null,rel(v).toFixed(1)+'배')); L.append(mid,n); ol.append(L); }); if(!list.length) ol.append(state('없음','')); p.append(ol); return p; };
    two.append(mk('🏆 평소보다 터진 영상', sorted.slice(0,8)), mk('💀 평소보다 부진한 영상', sorted.slice(-8).reverse()));
    box.append(two);
    const rep = panel('채널 성적표', '최근 14일 · 올린 지 하루 지난 영상 기준');
    const w = el('div','scroll'); const t = el('table'); t.innerHTML='<thead><tr><th>채널</th><th>영상</th><th>중앙값</th><th>최고</th><th>🔥 3배+</th><th>💀 절반 미만</th></tr></thead>';
    const tb = el('tbody');
    Object.entries(chs).sort((a,b)=>med(b[1].map(x=>x.views))-med(a[1].map(x=>x.views))).forEach(([ch,L])=>{ const tr=el('tr'); const m=med(L.map(x=>x.views)); tr.append(el('td','name',ch), el('td',null,String(L.length)), el('td',null,man(m)), el('td',null,man(Math.max(...L.map(x=>x.views)))), el('td',null,String(L.filter(v=>v.views>=3*m).length)), el('td',null,String(L.filter(v=>v.views<0.5*m).length))); tb.append(tr); });
    t.append(tb); w.append(t); rep.append(w); box.append(rep);
    const hours = {}; for(const v of old){ const h = Math.floor(((new Date(v.ts*1000).getUTCHours()+9)%24)/3)*3; (hours[h]=hours[h]||[]).push(rel(v)); }
    const hp = panel('⏰ 업로드 시간대(한국 시간)', '채널 중앙값 대비 배수의 중앙값'); const hb = el('div','cats');
    const hmx = Math.max(1, ...Object.values(hours).map(a=>med(a)));
    for(let h=0; h<24; h+=3){ const a=hours[h]||[]; const r=el('div','cat'); r.append(el('span',null,`${h}~${h+3}시`)); const b2=el('div','bar'); const i=el('i'); i.style.width=(a.length?med(a)/hmx*100:0).toFixed(1)+'%'; b2.append(i); r.append(b2, el('small',null, a.length?`${med(a).toFixed(2)}배 · ${a.length}편`:'없음')); hb.append(r); }
    hp.append(hb);
    const polv = old.filter(v=>OURPOL.includes(v.ch));
    const pp = panel('👤 인물별 성과 (정치 3채널)', '제목에 그 인물이 들어간 영상의 조회 중앙값'); const pb = el('div','cats');
    const rows = PEOPLE.map(p=>{ const a=polv.filter(v=>(v.title||'').includes(p)).map(v=>v.views); return [p, a.length, med(a)]; }).filter(r=>r[1]>=2).sort((a,b)=>b[2]-a[2]);
    const pmx = Math.max(1, ...rows.map(r=>r[2]));
    for(const [p,n,m] of rows){ const r=el('div','cat'); r.append(el('span',null,p)); const b3=el('div','bar'); const i=el('i'); i.style.width=(m/pmx*100).toFixed(1)+'%'; b3.append(i); r.append(b3, el('small',null,`${man(m)} · ${n}편`)); pb.append(r); }
    if(!rows.length) pb.append(state('데이터 부족',''));
    pp.append(pb);
    const two2 = el('div','cols2'); two2.append(hp, pp); box.append(two2);
  }

  /* ---------- 불러오기 ---------- */
  function load(){
    render();
    if(!db || !tsel) return;
    if(unsub){ for(const u of unsub){ try{ u(); }catch(e){} } unsub=null; }
    const day = tsel, part = {};
    const merge = ()=>{ if(!part.d) return;
      docs[day] = Object.assign({}, part.d, {explore: part.x && part.x.explore, pol: part.p && part.p.pol, actions: part.a && part.a.actions, dormant: part.a && part.a.dormant,
        media: part.m && part.m.media, sns: part.s ? part.s.sns : part.d.sns, community: part.s ? part.s.community : part.d.community, gtrends: part.s ? part.s.gtrends : part.d.gtrends, noe: part.n && part.n.noe});
      if(!docs[day].day) docs[day].day = day; if(!$('v-disc').hidden) render(); };
    unsub = ['d','x','p','a','m','s','n'].map(k => db.doc(`trend/${k}-${day}`).onSnapshot(s=>{ part[k] = s.exists ? s.data() : (k==='d' ? {day, updated:0} : null); merge(); }, ()=>{}));
  }

  // 새로고침 버튼 — 저장된 수치를 즉시 다시 읽고, 로컬 수집을 요청해 둔다(cmd/refresh)
  function freshText(){
    const u = snap && snap.updated ? new Date(snap.updated*1000) : null;
    if(!u) return '';
    const m = Math.round((Date.now()-u.getTime())/60000);
    const ago = m < 1 ? '방금' : m < 60 ? `${m}분 전` : `${Math.floor(m/60)}시간 ${m%60}분 전`;
    return `수집 ${ago} · ${u.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}`;
  }
  // 새로고침 누르면 텔레그램(대시보드 알림 봇)으로 바로 알림 (1001)
  const TG = {t:'8714624996:AAFHopLQV8kju_0-e85SQ27QdHqmgVg0pLs', c:'6959280259'};
  function tg(text){
    try{
      fetch(`https://api.telegram.org/bot${TG.t}/sendMessage`, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({chat_id: TG.c, text})}).then(r=>r.json()).then(j=>{
          if(!j.ok) paintFresh(freshText()+' · 텔레그램 실패: '+(j.description||''));
        }).catch(e=>{ paintFresh(freshText()+' · 텔레그램 못 보냄(차단)'); });
    }catch(e){}
  }
  function paintFresh(msg){ const e=$('freshline'); if(e) e.textContent = msg || freshText(); }
  setInterval(()=>{ if($('freshline') && !$('freshline').dataset.busy) paintFresh(); }, 60000);
  $('refresh').addEventListener('click', async ()=>{
    const b=$('refresh'), f=$('freshline'); b.disabled=true; const old=b.textContent; b.textContent='불러오는 중…';
    if(f) f.dataset.busy='1';
    try{
      if(db){
        const s1 = await db.doc('snap/latest').get();
        if(s1 && s1.exists){ snap = s1.data(); }
        if(idx===null || idx){ const s2 = await db.doc('trend/index').get(); idx = s2 && s2.exists ? s2.data() : idx; }
        try{ await db.doc('cmd/refresh').set({ at: Date.now(), by: 'dashboard' }); }catch(e){}
        tg(`🔄 대시보드 새로고침 눌렀어 — ${new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}\n${freshText()||'수집 기록 없음'}\n새로 긁어오려면 꼬봉한테 "대시보드 갱신" 이라고 해줘.`);
        render(); if(view==='mine') mineExtra();
        paintFresh(freshText() + ' · 새 수집 요청함');
      } else {
        paintFresh('데이터에 연결할 수 없어 — claude.ai 에서 로그인한 상태로 열어줘');
      }
    } catch(e){ paintFresh('다시 불러오지 못했어 — 잠시 뒤 눌러줘'); }
    finally{ b.disabled=false; b.textContent=old; if(f) delete f.dataset.busy; }
  });

  window.addEventListener('snapgist', e=>{ if(!snap || (snap.updated||0) < e.detail.updated){ snap = e.detail; paintFresh(); if(view==='mine') mineExtra(); } });
  show();
  (async function(){
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if(!db){ if(view!=='mine') render(); return; }
    db.doc('snap/latest').onSnapshot(s=>{ if(!s.exists || (snap && (snap.updated||0) > (s.data().updated||0))) return; snap = s.data(); paintFresh(); if(view==='mine') mineExtra(); }, ()=>{});
    db.doc('trend/index').onSnapshot(s=>{
      idx = s.exists ? s.data() : null;
      if(idx && (!tsel || !idx.days.includes(tsel))) { tsel = idx.latest; load(); } else if(!$('v-disc').hidden) render();
    }, ()=>{});
  })();
})();
</script>
